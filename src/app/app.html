<div class="drawer drawer-end min-h-dvh">
  <input
    id="chat-drawer"
    type="checkbox"
    class="drawer-toggle"
    autocomplete="off"
  />
  <div class="drawer-content flex min-h-dvh flex-col bg-base-200">
    <main class="flex flex-1 flex-col items-center justify-center gap-4 p-4">
      <h1 class="text-center text-2xl font-semibold text-base-content">
        AgUiDemo
      </h1>
      <label for="chat-drawer" class="btn btn-primary drawer-button">
        Open chat
      </label>
    </main>
    <router-outlet />
  </div>
  <div class="drawer-side z-1002">
    <label
      for="chat-drawer"
      class="drawer-overlay"
      aria-label="Close chat"
    ></label>
    <app-chat />
  </div>
</div>
